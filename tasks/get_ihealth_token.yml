---
# Fetches (or refreshes) the iHealth OAuth2 token. Included both once at the
# start of Play 2 and again mid-poll by poll_ihealth_analysis.yml if the
# token expires before a long-running analysis finishes.

- name: Get an iHealth API OAuth2 token
  ansible.builtin.uri:
    url: "{{ ihealth_token_url }}"
    method: POST
    headers:
      Authorization: "Basic {{ (ihealth_client_id + ':' + ihealth_client_secret) | b64encode }}"
      Content-Type: "application/x-www-form-urlencoded"
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      scope: ihealth
    status_code: [200]
  register: token_response
  no_log: true

- name: Set the iHealth auth header
  ansible.builtin.set_fact:
    ihealth_auth_header: "{{ token_response.json.token_type }} {{ token_response.json.access_token }}"
  no_log: true
