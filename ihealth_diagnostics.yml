---
# ============================================================================
# F5 BIG-IP qkview -> iHealth -> diagnostics table -> public git repo.
#
#   Play 1  (hosts: bigip)     generate + download a qkview per device
#   Play 2  (hosts: localhost) upload to iHealth, poll for analysis, fetch
#                              diagnostics, render a sorted Markdown report
#   Play 3  (hosts: localhost) clone the PUBLIC diagnostics repo, add the new
#                              report(s), regenerate the README index, push
#
# Secrets expected at runtime (from AWX credentials or --extra-vars):
#   f5_username, f5_password             - BIG-IP account (qkview generation)
#   ihealth_client_id, ihealth_client_secret - F5 iHealth API OAuth2 client
#   git_pat                              - token with write access to the
#                                           PUBLIC diagnostics repo
#
# Only the rendered Markdown report is ever pushed — the raw .qkview file
# (full config/license dump) never leaves staging_dir. See README.md.
# ============================================================================

- name: Generate and retrieve a qkview from each BIG-IP
  hosts: bigip
  gather_facts: false
  vars:
    backup_date: "{{ lookup('pipe', 'date -u +%Y-%m-%d') }}"
    qkview_name: "{{ inventory_hostname }}-{{ backup_date }}.qkview"
    # The name created ON the device only accepts word characters and dots
    # (no hyphens) — sanitize just that copy; local staging stays readable.
    qkview_remote_name: "{{ (inventory_hostname + '-' + backup_date) | replace('-', '_') }}.qkview"
    f5_base_url: "https://{{ ansible_host }}:{{ f5_server_port | default(443) }}"

  tasks:
    - name: Ensure the local staging directory exists
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    # f5networks.f5_modules.bigip_qkview's create+download flow hits a known,
    # still-unresolved upstream bug (KeyError: '_taskState' —
    # F5Networks/f5-ansible#2216): its async-task poller doesn't understand
    # this BIG-IP's response shape. Hand-rolled below against the documented
    # CM autodeploy qkview worker instead, which bypasses the buggy code path.

    - name: Start qkview generation on the device
      ansible.builtin.uri:
        url: "{{ f5_base_url }}/mgmt/cm/autodeploy/qkview"
        method: POST
        url_username: "{{ f5_username }}"
        url_password: "{{ f5_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          name: "{{ qkview_remote_name }}"
        status_code: [200, 201, 202]
      register: qkview_create

    - name: Wait for qkview generation to finish on the device
      ansible.builtin.uri:
        url: "{{ f5_base_url }}/mgmt/cm/autodeploy/qkview/{{ qkview_create.json.id }}"
        method: GET
        url_username: "{{ f5_username }}"
        url_password: "{{ f5_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: qkview_poll
      until: (qkview_poll.json.status | default('UNKNOWN') | upper) in ['FINISHED', 'COMPLETED', 'COMPLETE', 'SUCCESS', 'SUCCEEDED']
      retries: "{{ qkview_poll_retries }}"
      delay: "{{ qkview_poll_delay }}"
      failed_when: (qkview_poll.json.status | default('UNKNOWN') | upper) in ['FAILED', 'ERROR', 'CANCELLED', 'CANCELED']

    - name: Download the completed qkview in chunks
      ansible.builtin.shell: |
        set -euo pipefail
        QKVIEW_PATH="{{ qkview_poll.json.qkviewUri | default('/mgmt/cm/autodeploy/qkview-downloads/' + qkview_remote_name) }}"
        # The device may return an absolute URL pointing at itself as
        # localhost (its own internal view), which is unreachable from
        # outside, so always rebuild from the path, ignoring any embedded host.
        if [[ "$QKVIEW_PATH" == http* ]]; then
          QKVIEW_PATH="/$(echo "$QKVIEW_PATH" | sed -E 's#^https?://[^/]+/##')"
        fi
        URL="{{ f5_base_url }}${QKVIEW_PATH}"
        DEST="{{ staging_dir }}/{{ qkview_name }}"
        CHUNK=1048576
        start=0
        : > "$DEST"
        while true; do
          end=$((start + CHUNK - 1))
          tmp=$(mktemp)
          code=$(curl -k -s -o "$tmp" -w "%{http_code}" \
            -u "${F5_USER}:${F5_PASS}" \
            -H "Content-Range: ${start}-${end}/*" \
            "$URL")
          if [ "$code" = "400" ] || [ "$code" = "416" ]; then
            rm -f "$tmp"
            break
          fi
          size=$(wc -c < "$tmp")
          cat "$tmp" >> "$DEST"
          rm -f "$tmp"
          if [ "$size" -lt "$CHUNK" ]; then
            break
          fi
          start=$((start + size))
        done
        echo "Downloaded $(wc -c < "$DEST") bytes to $DEST"
      args:
        executable: /bin/bash
      environment:
        F5_USER: "{{ f5_username }}"
        F5_PASS: "{{ f5_password }}"
      register: qkview_download

    - name: Report the downloaded qkview size
      ansible.builtin.debug:
        msg: "{{ qkview_download.stdout }}"

    - name: Remove the transient qkview from the device
      f5networks.f5_modules.bigip_command:
        commands:
          - "run util bash -c 'rm -f /var/tmp/{{ qkview_remote_name }}'"
        provider: "{{ f5_provider }}"
      when: remove_remote_qkview | bool
      ignore_errors: true


- name: Upload each qkview to iHealth and render a diagnostics report
  hosts: localhost
  gather_facts: false
  vars:
    backup_date: "{{ lookup('pipe', 'date -u +%Y-%m-%d') }}"

  tasks:
    - name: Confirm at least one qkview was captured this run
      ansible.builtin.find:
        paths: "{{ staging_dir }}"
        patterns: "*.qkview"
      register: staged
      failed_when: staged.matched == 0

    - name: Get an iHealth API OAuth2 token
      ansible.builtin.uri:
        url: "{{ ihealth_token_url }}"
        method: POST
        headers:
          Authorization: "Basic {{ (ihealth_client_id + ':' + ihealth_client_secret) | b64encode }}"
          Content-Type: "application/x-www-form-urlencoded"
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          scope: ihealth
        status_code: [200]
      register: token_response
      no_log: true

    - name: Set the iHealth auth header
      ansible.builtin.set_fact:
        ihealth_auth_header: "{{ token_response.json.token_type }} {{ token_response.json.access_token }}"
      no_log: true

    - name: Upload, poll and render a report for each staged qkview
      ansible.builtin.include_tasks: tasks/process_qkview.yml
      loop: "{{ staged.files }}"
      loop_control:
        loop_var: qkview_file
        label: "{{ qkview_file.path | basename }}"


- name: Publish diagnostics reports to the public repository
  hosts: localhost
  gather_facts: false
  vars:
    backup_date: "{{ lookup('pipe', 'date -u +%Y-%m-%d') }}"

  tasks:
    - name: Confirm at least one diagnostics report was generated this run
      ansible.builtin.find:
        paths: "{{ staging_dir }}/reports"
        patterns: "*.md"
      register: staged_reports
      failed_when: staged_reports.matched == 0

    - name: DEBUG - confirm git_pat is populated (length only, not the value)
      ansible.builtin.debug:
        msg: "git_pat length = {{ git_pat | length }}"

    - name: Clone (or initialize, on first run) the diagnostics repository
      ansible.builtin.shell: |
        set -euo pipefail
        rm -rf "{{ work_dir }}"
        if git clone --branch "{{ diagnostics_branch }}" "https://{{ git_pat }}@{{ diagnostics_repo }}" "{{ work_dir }}" 2>clone_err.log; then
          echo "CLONED"
        else
          echo "CLONE_FAILED: $(cat clone_err.log)"
          mkdir -p "{{ work_dir }}"
          cd "{{ work_dir }}"
          git init -q -b "{{ diagnostics_branch }}"
          git remote add origin "https://{{ git_pat }}@{{ diagnostics_repo }}"
          echo "INITIALIZED"
        fi
      args:
        executable: /bin/bash
      environment:
        GIT_TERMINAL_PROMPT: "0" # fail fast instead of hanging if auth fails non-interactively
      register: clone_result

    - name: DEBUG - show which branch the clone/init task took
      ansible.builtin.debug:
        msg: "{{ clone_result.stdout_lines }}"

    - name: Ensure the diagnostics directory exists in the repo checkout
      ansible.builtin.file:
        path: "{{ work_dir }}/diagnostics"
        state: directory
        mode: "0750"

    - name: Copy the freshly rendered reports into the repo checkout
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ work_dir }}/diagnostics/{{ item.path | basename }}"
        mode: "0640"
      loop: "{{ staged_reports.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Regenerate the repository README index
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ work_dir }}"
        {
          echo "# F5 iHealth Diagnostics"
          echo
          echo "Automated pipeline: qkview generated on a BIG-IP -> uploaded to F5 iHealth ->"
          echo "diagnostics retrieved and rendered as a Markdown table. One report per run."
          echo
          echo "| Date | Hostname | Critical | High | Medium | Low | Report |"
          echo "|------|----------|----------|------|--------|-----|--------|"
          for f in $(ls diagnostics/*.md 2>/dev/null | sort -r); do
            base=$(basename "$f" .md)
            date="${base: -10}"
            host="${base%-$date}"
            critical=$(grep -m1 '^| Critical' "$f" | awk -F'|' '{gsub(/ /,"",$3); print $3}')
            high=$(grep -m1 '^| High' "$f" | awk -F'|' '{gsub(/ /,"",$3); print $3}')
            medium=$(grep -m1 '^| Medium' "$f" | awk -F'|' '{gsub(/ /,"",$3); print $3}')
            low=$(grep -m1 '^| Low' "$f" | awk -F'|' '{gsub(/ /,"",$3); print $3}')
            echo "| ${date} | ${host} | ${critical} | ${high} | ${medium} | ${low} | [${base}](${f}) |"
          done
        } > README.md
      args:
        executable: /bin/bash
      register: readme_regen
      changed_when: true

    - name: Stage, commit and push the new diagnostics report(s)
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ work_dir }}"
        git config user.name  "{{ git_user_name }}"
        git config user.email "{{ git_user_email }}"
        git add -A
        if git diff --cached --quiet; then
          echo "NO_CHANGES"
        else
          git commit -q -m "iHealth diagnostics {{ backup_date }}"
          git push -q -u origin "{{ diagnostics_branch }}"
          echo "PUSHED"
        fi
      args:
        executable: /bin/bash
      environment:
        GIT_TERMINAL_PROMPT: "0" # fail fast instead of hanging if auth fails non-interactively
      register: push_result
      changed_when: "'PUSHED' in push_result.stdout"

    - name: Publish summary
      ansible.builtin.debug:
        msg: >-
          Published {{ staged_reports.matched }} diagnostics report(s);
          repo push result: {{ 'pushed' if 'PUSHED' in push_result.stdout else 'no changes' }}.
